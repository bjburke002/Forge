# Overrides for the argo-cd chart (10.10.5). Everything not listed uses the chart's defaults:
#   helm show values argo/argo-cd --version 10.10.5
# Sized for the two t3a.small system nodes: single replicas, no SSO or notifications.

global:
  domain: argocd.forgeappservices.com

# Not used yet: SSO is out of scope and alerting goes through Alertmanager.
dex:
  enabled: false
notifications:
  enabled: false

# Requests keep the scheduler honest on small nodes; memory limits stop one
# component starving the add-ons. Defaults are unset ({}).
controller:
  env:
    - name: "GOMEMLIMIT"
      value: "900MiB"
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { memory: 1Gi }

repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 1Gi }

server:
  resources:
    requests: { cpu: 50m, memory: 512Mi }
    limits:   { memory: 1Gi }

applicationSet:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { memory: 128Mi }

redis:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { memory: 64Mi }

# Health check from ArgoCD docs: https://argo-cd.readthedocs.io/en/latest/operator-manual/health/#argocd-app
configs:
  cm:
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    resource.customizations.health.forge.dev_ForgeService: |
      hs = {}
      if obj.status == nil then
        hs.status = "Progressing"
        hs.message = "Waiting for the controller"
        return hs
      end

      local generation = obj.metadata.generation or 0
      local observed = obj.status.observedGeneration or 0
      if observed < generation then
        hs.status = "Progressing"
        hs.message = "Waiting on the controller to reconcile the latest spec"
        return hs
      end

      local ready = nil
      local degraded = nil
      if obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            ready = condition
          elseif condition.type == "Degraded" then
            degraded = condition
          end
        end
      end

      if degraded ~= nil and degraded.status == "True" then
        hs.status = "Degraded"
        hs.message = degraded.message
        return hs
      end
      if ready ~= nil and ready.status == "True" then
        hs.status = "Healthy"
        hs.message = ready.message
        return hs
      end

      hs.status = "Progressing"
      hs.message = (ready ~= nil and ready.message) or "Waiting for the Ready condition"
      return hs