apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: registry-allowlist
spec:
  validationActions:
    - Audit
  matchConstraints:
    namespaceSelector:
      matchLabels: 
        forge.dev/tenant: "true"
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
  variables:
    - name: allowed
      expression: "'241197444395.dkr.ecr.us-east-1.amazonaws.com/forge/'"
  validations:
    - message: "Images are only allowed from Forge ECR repositories"
      expression: |
        object.spec.containers.all(c, c.image.startsWith(variables.allowed)) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.startsWith(variables.allowed))) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, c.image.startsWith(variables.allowed)))