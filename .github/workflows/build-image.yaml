name: "Build Docker Container"

on:
  workflow_call:
    inputs:
      ecr-repo-name:
        required: true
        type: string
      build-context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: "us-east-1"
    secrets:
      ROLE_ARN:
        required: true
    outputs:
      image: 
        description: "Image Tag reference"
        value: ${{jobs.build-and-push-docker-image.outputs.image}}
      digest:
        description: "Image digest from ECR"
        value: ${{jobs.build-and-push-docker-image.outputs.digest}}

jobs:
  build-and-push-docker-image:
    name: "Build and Push Docker Image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{steps.push.outputs.digest}}


    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{secrets.ROLE_ARN}}
          aws-region: ${{inputs.aws-region}}
      
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Container Image 
        id: image
        env: 
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPO_NAME: ${{inputs.ecr-repo-name}}
          DOCKERFILE: ${{inputs.dockerfile}}
          BUILD_CONTEXT: ${{inputs.build-context}}
        run: | 
          IMAGE="$REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG" 
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          docker build -t "$IMAGE" -f "$DOCKERFILE" "$BUILD_CONTEXT"
    
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.76.1"
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p trivy-bin
          tar -xzf "$tarball" -C trivy-bin trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      - name: Scan Container Image with Trivy
        env:
          IMAGE: ${{steps.image.outputs.image}}
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
      
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{steps.image.outputs.image}}
          syft-version: v1.56.0
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false
      
      - name: Push Container Image to ECR
        id: push
        env:
          IMAGE: ${{steps.image.outputs.image}}
        run: |
          docker push "$IMAGE"

          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"