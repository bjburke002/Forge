name: Deploy Forge Controller

on:
  push:
    branches:
      - main
    paths: [
      'pkg/**', 'internal/**', 'cmd/forge-controller/**', '.github/workflows/deploy-controller.yaml',
      'go.mod', 'go.sum', 'Dockerfile','.dockerignore', '.github/workflows/build-image.yaml'
    ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-forge-controller
  cancel-in-progress: false
  
jobs:
  deploy-forge-controller:
    uses: './.github/workflows/build-image.yaml'
    with:
      ecr-repo-name: "forge/forge-controller"
      build-context: "."
      dockerfile: "Dockerfile"
    secrets:
      ROLE_ARN: ${{secrets.ROLE_ARN}}
    permissions:
      contents: read
      id-token: write
  update-manifests:
    name: "Update kustomize manifests"
    runs-on: ubuntu-latest
    needs: deploy-forge-controller
    permissions:
      contents: read
    defaults:
      run:
        working-directory: 'config'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ssh-key: ${{secrets.DEPLOY_KEY}}
        
      - name: Set Image Tag
        env:
          IMAGE: ${{needs.deploy-forge-controller.outputs.image}}
        run: kustomize edit set image "forge-controller=$IMAGE"

      - name: Commit and Push
        env: 
          IMAGE_TAG: ${{github.sha}}
          SERVICE: 'forge-controller'
        run: |
          git config user.name 'forge-deploy-bot'
          git config user.email '41898282+forge-deploy-bot@users.noreply.github.com'
          git add kustomization.yaml
          # Nothing to commit if this SHA is already deployed (e.g. a re-run).
          git diff --cached --quiet && exit 0
          git commit -m "deploy($SERVICE): $IMAGE_TAG"
          git pull --rebase
          git push 
