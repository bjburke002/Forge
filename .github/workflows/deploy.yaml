name: 'Deploy Payments-API'

on:
  push:
    branches:
      - main
    paths: ['examples/payments-api/**', '.github/workflows/deploy.yaml']
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVICE: 'payments-api'
  ECR_REPOSITORY: '241197444395.dkr.ecr.us-east-1.amazonaws.com/forge/payments-api'

# One deploy at a time, so back-to-back merges bump the tag in order instead of racing.
concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

# One deploy at a time, so back-to-back merges bump the tag in order instead of racing.
concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-test-go:
    name: 'Test and build Go code'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'examples/${{ env.SERVICE }}'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'examples/${{ env.SERVICE }}/go.mod'
          cache-dependency-path: 'examples/${{ env.SERVICE }}/go.sum'
      
      - name: Verify Go Dependencies
        run: go mod verify
      
      - name: Run Go Vet
        run: go vet ./...
      
      - name: Run Go Test
        run: go test ./...
  
  build-and-push-docker-image:
    name: 'Build and Push Docker Image'
    runs-on: ubuntu-latest
    needs: build-and-test-go
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: 'examples/${{ env.SERVICE }}'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/forge/$SERVICE:$IMAGE_TAG" .
          docker push "$REGISTRY/forge/$SERVICE:$IMAGE_TAG"

  # Updating kustomization.yaml in place here to completely automate the rollout process on new image SHA
  update-manifests:
    name: 'Bump image tag in manifests'
    runs-on: ubuntu-latest
    needs: build-and-push-docker-image
    permissions:
      contents: read
    defaults:
      run:
        working-directory: 'charts/payments'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
          ssh-key: ${{secrets.DEPLOY_KEY}}

      - name: Set image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: kustomize edit set image "$SERVICE=$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Commit and push
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name 'forge-deploy-bot'
          git config user.email '41898282+forge-deploy-bot@users.noreply.github.com'
          git add kustomization.yaml
          # Nothing to commit if this SHA is already deployed (e.g. a re-run).
          git diff --cached --quiet && exit 0
          git commit -m "deploy($SERVICE): $IMAGE_TAG"
          git pull --rebase
          git push
