name: 'Deploy Payments-API'

on:
  push:
    branches:
      - main
    paths: ['examples/payments-api/**', '.github/workflows/deploy.yaml']
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVICE: 'payments-api'

jobs:
  build-and-test-go:
    name: 'Test and build Go code'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'examples/${{ env.SERVICE }}'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'examples/${{ env.SERVICE }}/go.mod'
          cache-dependency-path: 'examples/${{ env.SERVICE }}/go.sum'
      
      - name: Verify Go Dependencies
        run: go mod verify
      
      - name: Run Go Vet
        run: go vet ./...
      
      - name: Run Go Test
        run: go test ./...
  
  build-and-push-docker-image:
    name: 'Build and Push Docker Image'
    runs-on: ubuntu-latest
    needs: build-and-test-go
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: 'examples/${{ env.SERVICE }}'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/forge/$SERVICE:$IMAGE_TAG" .
          docker push "$REGISTRY/forge/$SERVICE:$IMAGE_TAG"