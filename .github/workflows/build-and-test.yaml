name: 'Build and Test'

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-payments:
    name: 'Test and build Payments'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'examples/payments-api'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'examples/payments-api/go.mod'
          cache-dependency-path: 'examples/payments-api/go.sum'
      
      - name: Verify Go Dependencies
        run: go mod verify
      
      - name: Run Go Vet
        run: go vet ./...

      - name: Run Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          # Pin to version
          version: "2026.2.2"
          install-go: false
      
      - name: Run Govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: "go.mod"
      
      - name: Run Go Test
        run: go test ./...
      
      - name: Build image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "payments-api:$IMAGE_TAG"-f Dockerfile .

  build-and-test-forge-controller:
    name: 'Test and Build Forge Controller'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "go.sum"
      
      - name: Verify Go Dependencies
        run: go mod verify
      
      - name: Run Go Vet
        run: go vet ./...
      
      - name: Run Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          # Pin to version
          version: "2026.2.2"
          install-go: false
      
      - name: Run Govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: "go.mod"
      
      - name: Regenerate CRD, deep-copy and RBAC
        run: | 
          go tool controller-gen object crd \
           rbac:roleName=forge-controller paths=./... output:crd:dir=./config/crd output:rbac:dir=./config/rbac
      
      - name: Ensure generated files are up to date 
        run: git diff --exit-code

      - name: Set up envtest
        run: echo "KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.24 use 1.36 -p path)" >> "$GITHUB_ENV"

      - name: Cache envtest binaries
        uses: actions/cache@v6
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{runner.os}}-1.36
      
      - name: Run forge-controller unit tests
        run: go test ./...
  test-terraform:
    name: 'Terraform fmt and validate'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'infra/terraform'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.6'
      
      - name: Terraform Format
        run: terraform fmt -recursive -check

      - name: Terraform Init and Validate - Persistent
        run: |
          cd persistent
          terraform init -backend=false
          terraform validate
      
      - name: Terraform Init and Validate - Root
        run: |
          terraform init -backend=false 
          terraform validate
        