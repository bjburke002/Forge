name: 'Build and Deploy Forge CLI'

on:
  push: 
    tags: ['v*']

permissions: 
  contents: write

jobs:
  release-cli:
    name: "Build and release CLI"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "go.sum"

      - name: Verify go dependencies
        run: go mod verify
      
      - name: Run Go Vet
        run: go vet ./...
      
      - name: Build forge CLI binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 windows/amd64; do
            IFS=/ read -r GOOS GOARCH <<< "$target"
            ext=""
            if [[ "$GOOS" == "windows" ]]; then
              ext=".exe"
            fi
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
              -o "dist/forge_${GOOS}_${GOARCH}${ext}" ./cmd/forge
          done
          cd dist && sha256sum forge_* > checksums.txt
        
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{github.token}}
          TAG: ${{github.ref_name}}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
      