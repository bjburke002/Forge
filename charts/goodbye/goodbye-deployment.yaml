apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: goodbye
  name: goodbye-nginx
  labels:
    app: goodbye-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: goodbye-nginx
  template:
    metadata:
      labels:
        app: goodbye-nginx
    spec:
      containers:
        - name: nginx
          image: nginxdemos/hello:latest
          ports:
          - containerPort: 80
