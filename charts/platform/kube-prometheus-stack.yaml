apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    name: kube-prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    targetRevision: "92.11.0"
    path: .
    helm:
      valuesObject:
        crds:
          enabled: false
        extraManifests:
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: grafana-admin
              namespace: kube-prometheus
            spec:
              refreshInterval: 1h0m0s
              secretStoreRef:
                name: aws-secrets-manager
                kind: ClusterSecretStore
              target:
                name: grafana-admin
              dataFrom:
                - extract:
                    key: "forge/grafana-admin"
        prometheusOperator:
          admissionWebhooks:
            enabled: false
          tls:
            enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        alertmanager:
          enabled: false
        prometheus:
          prometheusSpec:
            ruleSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            retention: "24h"
            resources:
              requests:
                memory: 512Mi
                cpu: 250m
              limits:
                memory: 1Gi
        grafana:
          admin:
            existingSecret: grafana-admin  
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi    
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-prometheus    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true