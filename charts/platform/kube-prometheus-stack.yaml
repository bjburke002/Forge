apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    name: kube-prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    targetRevision: "92.11.0"
    path: .
    helm:
      valuesObject:
        crds:
          enabled: false
        extraManifests:
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: grafana-admin
              namespace: kube-prometheus
            spec:
              refreshInterval: 1h0m0s
              secretStoreRef:
                name: aws-secrets-manager
                kind: ClusterSecretStore
              target:
                name: grafana-admin
              dataFrom:
                - extract:
                    key: "forge/grafana-admin"
        prometheusOperator:
          admissionWebhooks:
            enabled: false
          tls:
            enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        alertmanager:
          enabled: false
        prometheus:
          serviceAccount:
            create: true
            name: prometheus-sa
          prometheusSpec:
            ruleSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            retention: "24h"
            remoteWrite:
              - url: "https://aps-workspaces.us-east-1.amazonaws.com/workspaces/ws-46b92863-4ba3-4e9b-8228-92e07c36f144/api/v1/remote_write"
                sigv4:
                  region: us-east-1
                writeRelabelConfigs:
                  - sourceLabels: [__name__]
                    regex: "forge:.*"
                    action: keep
            resources:
              requests:
                memory: 512Mi
                cpu: 250m
              limits:
                memory: 1Gi
        grafana:
          admin:
            existingSecret: grafana-admin  
          plugins:
            - grafana-amazonprometheus-datasource
          grafana.ini:
            aws:
              allowed_auth_providers: default
              forward_settings_to_plugins: grafana-amazonprometheus-datasource
          serviceAccount:
            create: true
            name: grafana-sa
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
          additionalDataSources:
            - name: AMP
              type: grafana-amazonprometheus-datasource
              access: proxy
              url: "https://aps-workspaces.us-east-1.amazonaws.com/workspaces/ws-46b92863-4ba3-4e9b-8228-92e07c36f144"
              jsonData:
                httpMethod: POST
                sigV4Auth: true
                sigV4AuthType: default
                sigV4Region: us-east-1
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-prometheus    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true