apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forge-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    name: forge-controller
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  project: default

  source:
    repoURL: https://github.com/bjburke002/Forge.git
    targetRevision: main
    path: config
    
  destination:
    server: https://kubernetes.default.svc
    namespace: forge-system
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      refresh: true