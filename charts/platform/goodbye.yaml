apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: goodbye
  namespace: argocd
  finalizers: 
    - resources-finalizer.argocd.argoproj.io
  labels:
    name: goodbye
spec:
  project: default

  source:
    repoURL: https://github.com/bjburke002/Forge.git
    targetRevision: main
    path: charts/goodbye
  
  destination:
    server: https://kubernetes.default.svc 
    namespace: goodbye
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
