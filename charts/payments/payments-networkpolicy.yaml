apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-networkpolicy
spec:
  podSelector:
    matchLabels:
      app: payments
  policyTypes:
    - Ingress
  ingress:
    - from:
      - ipBlock:
          cidr: 10.20.0.0/24
      - ipBlock:
          cidr: 10.20.1.0/24
      ports:
        - protocol: TCP
          port: http
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-prometheus
      ports:
        - port: metrics
          protocol: TCP

