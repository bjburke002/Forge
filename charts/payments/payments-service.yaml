apiVersion: v1
kind: Service
metadata:
  name: payments-service
  labels:
    app: payments
spec:
  selector:
    app: payments
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
