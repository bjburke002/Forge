apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forge-system
resources:
- crd/forge.dev_forgeservices.yaml
- rbac/
- manager/forge-controller-deployment.yaml

images:
- name: forge-controller
  newName: 241197444395.dkr.ecr.us-east-1.amazonaws.com/forge/forge-controller
  newTag: a78e99f3d24ea1be5053077f5e64b622a0ef4dd4

# Make sure the CRDs can't get blown away
patches:
- patch: |-
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: forgeservices.forge.dev
      annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
  target:
    kind: CustomResourceDefinition
    name: forgeservices.forge.dev
