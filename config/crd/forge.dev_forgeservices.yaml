                  minReplicas:
                    description: minReplicas defines the minimum number of replicas
                      that can run at one time
                    format: int32
                    minimum: 1
                    type: integer
                  targetCPUUtilization:
                    default: 75
                    description: TargetCPU defines the HPA autoscaling threshold,
