              runtime:
                description: Runtime describes how the container runs
                properties:
                  port:
                    description: Port is the port number the application listens on
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - port
                type: object
              scaling:
                description: Scaling is responsible for the autoscaling requirements
