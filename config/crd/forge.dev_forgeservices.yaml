                    description: Availability defines uptime requirements aka 99.999%
                    pattern: ^[0-9]{1,2}(\.[0-9]{1,3})?$
                    type: string
                  latencyP99Ms:
                    description: LatencyP99MS defines P99 latency tresholds for the
