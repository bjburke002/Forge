---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: forgeservices.forge.dev
spec:
  group: forge.dev
  names:
    kind: ForgeService
    listKind: ForgeServiceList
    plural: forgeservices
    shortNames:
    - fsvc
    singular: forgeservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.ingress.host
      name: Host
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.availableReplicas
      name: Available
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              env:
                description: Env is a list of environment variables passed to the
                  manifest
                items:
                  properties:
                    name:
                      description: Name is the name of the env
                      pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                      type: string
                    value:
                      description: Value is the value to set the Env
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              health:
                description: Health defines paths for liveness and readiness probes
                properties:
                  liveness:
                    description: Liveness is the path for the workload's liveness
                      probe
                    maxLength: 256
                    pattern: ^/[A-Za-z0-9/._~-]*$
                    type: string
                  readiness:
                    description: Readiness is the path for the workload's readiness
                      probe
                    maxLength: 256
                    pattern: ^/[A-Za-z0-9/._~-]*$
                    type: string
                required:
                - liveness
                - readiness
                type: object
              image:
                description: Image is the container image that gets run
                minLength: 1
                type: string
              ingress:
                description: Ingress defines any needed ingress routes for the ForgeService
                properties:
                  host:
                    description: Host is the hostname for the ingress route
                    maxLength: 256
                    pattern: ^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)*[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
                    type: string
                  path:
                    default: /
                    description: Path is the ingress path aka the route to take once
