                    x-kubernetes-int-or-string: true
                required:
                - consumedPercent
                - remainingMinutes
                type: object
              observedGeneration:
                description: ObservedGeneration is the spec generation last reconciled
                format: int64
                type: integer
              url:
                description: URL is the ForgeService's public address, set when an
