                type: string
              resources:
                description: Resources defines resource reservations and limits
                properties:
                  limits:
                    description: Limits defines memory limits for the workload
                    properties:
                      memory:
                        anyOf:
                        - type: integer
                        - type: string
                        description: Memory defines the memory limit for the workload
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
