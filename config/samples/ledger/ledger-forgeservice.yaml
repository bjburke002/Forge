apiVersion: forge.dev/v1alpha1
kind: ForgeService
metadata:
  name: ledger
spec:
  owner: ledger-team
  image: 241197444395.dkr.ecr.us-east-1.amazonaws.com/forge/payments-api:ed2f94481b72933262ec8faf229257c02cd6e9f7
  runtime:
    port: 8080
  env:
    - name: LOG_LEVEL
      value: info
  scaling:
    minReplicas: 2
    maxReplicas: 5
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  health:
    readiness: /health/ready
    liveness: /health/live
  observability:
    metricsPort: 9090
  slo:
    availability: "99.9"
    latencyP99Ms: 500